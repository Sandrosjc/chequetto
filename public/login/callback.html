<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chequetto</title>
  <style>
    body {
      background: #0f1013;
      color: #e9e6df;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 4px solid #2b2d34;
      border-top: 4px solid #e7b866;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Entrando com GitHub...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');

    if (accessToken) {
      localStorage.setItem('supabase_token', accessToken);
      localStorage.setItem('supabase_refresh', refreshToken);
      
      fetch('https://chequetto-hujo.supabase.co/auth/v1/user', {
        headers: { Authorization: `Bearer ${accessToken}` }
      })
      .then(r => r.json())
      .then(user => {
        localStorage.setItem('chequetto_user', JSON.stringify(user));
        window.location.href = '/';
      });
    } else {
      window.location.href = '/login/';
    }
  </script>
</body>
</html>
